<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="switchboard-token" content="__SWITCHBOARD_TOKEN__" />
    <title>Switchboard</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="app">
      <canvas id="world" aria-label="The city: each person is a coding agent" tabindex="0"></canvas>

      <section id="loading" class="loading" aria-live="polite">
        <div class="loading__inner">
          <p class="wordmark">Switchboard</p>
          <p class="loading__line">Your agents, at golden hour</p>
          <div class="loading__bar" role="progressbar" aria-label="Loading the city" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="loading__fill"></span>
          </div>
          <p class="loading__note" id="loading-note">Warming up the renderer…</p>
        </div>
      </section>

      <nav class="lookdev" id="lookdev" aria-label="Look-dev controls" hidden>
        <div class="seg" role="radiogroup" aria-label="Time of day" id="tod">
          <button type="button" role="radio" data-tod="day">Day</button>
          <button type="button" role="radio" data-tod="sunset">Sunset</button>
          <button type="button" role="radio" data-tod="night">Night</button>
          <button type="button" role="radio" data-tod="auto">Auto</button>
        </div>
        <div class="seg" role="radiogroup" aria-label="Quality" id="quality">
          <button type="button" role="radio" data-q="auto">Auto</button>
          <button type="button" role="radio" data-q="cinematic">Cinematic</button>
          <button type="button" role="radio" data-q="balanced">Balanced</button>
          <button type="button" role="radio" data-q="light">Light</button>
        </div>
        <output class="stats" id="stats">…</output>
      </nav>

      <p class="fatal" id="fatal" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
